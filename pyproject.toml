[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "angel-editor"
version = "0.1.0"
description = "Local language filtering with edited MP4 output"
requires-python = ">=3.10"
dependencies = ["tomli; python_version < '3.11'"]

[project.optional-dependencies]
speech = ["faster-whisper"]
dev = ["pytest", "ruff"]

[project.scripts]
angel = "angel_editor.cli:main"

[tool.ruff]
line-length = 100
